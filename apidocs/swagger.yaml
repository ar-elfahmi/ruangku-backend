        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.WebResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.WebResponse'
      security:
      - BearerAuth: []
      summary: Detail ruang
      tags:
      - rooms
    put:
      parameters:
      - description: ID ruang
        in: path
        name: id
        required: true
        type: integer
      - description: Data ruang
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RoomRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Room'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.WebResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.WebResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.WebResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.WebResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.WebResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.WebResponse'
      security:
      - BearerAuth: []
      summary: Ubah ruang
      tags:
      - rooms
  /rooms/{id}/availability:
    get:
      parameters:
      - description: ID ruang
        in: path
        name: id
        required: true
        type: integer
      - description: Tanggal dengan format YYYY-MM-DD
        in: query
        name: date
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Availability'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.WebResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.WebResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.WebResponse'
      security:
      - BearerAuth: []
      summary: Ketersediaan ruang pada satu tanggal
      tags:
      - rooms
  /users/{id}/role:
    patch:
      parameters:
      - description: ID user
        in: path
        name: id
        required: true
        type: integer
      - description: Role baru
        in: body
        name: request
