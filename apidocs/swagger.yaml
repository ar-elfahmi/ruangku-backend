                  additionalProperties:
                    type: string
                  type: object
              type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.WebResponse'
      summary: Cek kesehatan service
      tags:
      - system
  /notifications:
    get:
      parameters:
      - description: Isi false untuk hanya menampilkan yang belum dibaca
        in: query
        name: is_read
        type: string
      responses:
