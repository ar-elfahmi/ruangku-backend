      parameters:
      - description: ID peminjaman
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.BookingLog'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.WebResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.WebResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.WebResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.WebResponse'
      security:
      - BearerAuth: []
      summary: Riwayat status peminjaman
      tags:
      - bookings
  /bookings/{id}/reject:
    patch:
      parameters:
      - description: ID peminjaman
        in: path
        name: id
        required: true
        type: integer
      - description: Catatan penolakan (opsional)
        in: body
        name: request
        schema:
          $ref: '#/definitions/model.StatusChangeRequest'
      responses:
        "200":
          description: OK
          schema:
