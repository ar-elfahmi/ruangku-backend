name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify modules
        run: go mod verify

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      # Team naming rule: declared identifiers and paths must not use
      # controller/handler. Library APIs such as fiber.Handler are fine.
      - name: Naming rule
        run: |
          if git grep -nE "(func|type|var|const)\s+\w*([Cc]ontroller|[Hh]andler)" -- "*.go"; then
            echo "Identifiers must not contain controller/handler."
            exit 1
          fi
          if git ls-files | grep -iE "(controller|handler)"; then
            echo "File and folder names must not contain controller/handler."
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Integration tests skip themselves when TEST_* is unset.
      - name: Test
        run: go test -race -count=1 ./...
